version: '3.8'
services:
  app:
    build: .
    ports: ['3000:3000']
    env_file: .env
    depends_on: [mongo, redis]
    volumes: ['./backend:/app/backend', './frontend:/app/frontend']
  mongo:
    image: mongo:7
    ports: ['27017:27017']
    volumes: ['mongo_data:/data/db']
    environment:
      MONGO_INITDB_DATABASE: vendor_passport
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    volumes: ['redis_data:/data']
    command: redis-server --appendonly yes
volumes:
  mongo_data:
  redis_data:
