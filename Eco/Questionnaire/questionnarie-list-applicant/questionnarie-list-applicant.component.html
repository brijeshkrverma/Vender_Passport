<div class="mainbody">
    <div class="card">
        <div class="card-body">
            <div class="row mb-3">
                <div class="col-md-12">
                    <div class="page-header">
                        <div class="page-title">
                            <!-- <a routerLink="/dashboard"><i class='bx bx-left-arrow-alt'></i> Dashboard </a> -->
                            <h3>List of Question</h3>
                        </div>
                    </div>
                </div>
            </div>

            <section class="deskwrap">
                <div class="row">
                    <div class="col-md-12">
                        <section>
                            <div class="container">
                                <form>
                                    <mat-stepper #stepper>

                                        <div formArrayName="exam">

                                            <div>
                                                <mat-step [label]="'Q ' + 1" [stepControl]="myControl">
                                                    <div class="quatiform">
                                                        <div class="colflex">
                                                            <div class="quationstep">
                                                                <p>Question 1 </p>
                                                                <h6>Value</h6>
                                                            </div>
                                                            <mat-radio-group matInput formControlName="UserAns"
                                                                class="quationtoptex" required>
                                                                <label class="radio-button-container" id="jsborder1">

                                                                    <mat-checkbox
                                                                        class="example-margin">Value1</mat-checkbox>
                                                                </label>
                                                                <label class="radio-button-container" id="jsborder1">
                                                                    <mat-checkbox
                                                                        class="example-margin">Value2</mat-checkbox>
                                                                </label>
                                                                <label class="radio-button-container" id="jsborder1">
                                                                    <mat-checkbox
                                                                        class="example-margin">Value3</mat-checkbox>
                                                                </label>
                                                                <label class="radio-button-container" id="jsborder1">
                                                                    <mat-checkbox
                                                                        class="example-margin">Value4</mat-checkbox>
                                                                </label>

                                                            </mat-radio-group>
                                                        </div>

                                                        <div class="fixfooter">
                                                            <div class="veryfybutton prewew">

                                                                <button style="border: none;
    background: no-repeat;" mat-button matStepperPrevious>Previous
                                                                    Question</button>
                                                            </div>
                                                            <div class="veryfybutton ">

                                                                <button style="border: none;
    background: no-repeat;" mat-button>Next Question</button>
                                                            </div>
                                                        </div>

                                                    </div>
                                                </mat-step>
                                                <mat-step>
                                                    <ng-template matStepLabel>Done</ng-template>
                                                    <div class="quationstep">
                                                        <p>You are now done.</p>
                                                    </div>
                                                    <div class="fixfooter">
                                                        <div class="veryfybutton">

                                                            <button mat-button matStepperPrevious>Back</button>
                                                        </div>
                                                        <div class="veryfybutton">

                                                            <button mat-button>Submit</button>
                                                        </div>
                                                    </div>
                                                </mat-step>
                                            </div>
                                        </div>

                                    </mat-stepper>
                                </form>

                            </div>
                        </section>
                    </div>

                </div>
            </section>


        </div>
    </div>
</div>
